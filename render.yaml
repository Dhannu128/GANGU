# Render Blueprint — one-click deploy of the GANGU backend.
# Push this file to GitHub, then in Render: New → Blueprint → pick this repo.
services:
  - type: web
    name: gangu-api
    runtime: python
    plan: free                 # bump to "starter" ($7/mo) if you need Playwright/MCP
    region: oregon             # or singapore for India proximity
    buildCommand: pip install -r config/requirements.txt && pip install -r api/requirements.txt
    startCommand: python api/main.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_API_KEY
        sync: false            # only needed for Whisper voice transcription
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: GANGU
      - key: FRONTEND_URLS
        sync: false            # set to your Vercel URL(s), comma-separated
      - key: FIREBASE_PROJECT_ID
        value: gangu-adffd
      - key: GANGU_AUTH_REQUIRED
        value: "true"
      - key: GANGU_DRY_RUN
        value: "true"          # never place real Zepto orders from prod
      - key: ENABLE_REAL_PURCHASES
        value: "false"
      - key: GANGU_STATE_BACKEND
        # The free service runs one worker. Enable MongoDB only after a real
        # MONGODB_URI and SWIGGY_TOKEN_ENCRYPTION_KEY are configured.
        value: memory
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: gangu
      - key: SWIGGY_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SWIGGY_REDIRECT_URI
        value: https://gangu-api.onrender.com/api/auth/callback/swiggy
